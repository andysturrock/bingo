name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.CDK_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web
        run: npm run build -w packages/web

      - name: Deploy Certificate
        run: npm run deploy -w packages/infra -- --context domainName=${{ secrets.DOMAIN_NAME }} --context certRegion=${{ secrets.CERT_REGION }} BingoCertificateStack

      - name: Deploy Infrastructure
        run: npm run deploy -w packages/infra -- --context domainName=${{ secrets.DOMAIN_NAME }} BingoInfraStack
